[project]
name = "carebridge"
version = "0.1.0"
description = "Backend for CareBridge: discharge instructions turned into a plain-language care plan"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "openrouter>=1.1.57",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--cov=main",
  "--cov=care_plan",
  "--cov=red_flags",
  "--cov=translate",
  "--cov=rate_limit",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
  "-m", "not live",
]
markers = [
  "live: calls the real model; needs OPENROUTER_API_KEY",
]

[tool.ruff]
target-version = "py313"
